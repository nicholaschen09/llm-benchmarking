providers:
  # Example Exa configuration. Adjust `base_url` and any extra parameters
  # to match the deployed Exa API you want to benchmark.
  - name: exa
    type: exa
    api_key_env: EXA_API_KEY
    base_url: https://api.exa.ai/search
    # Optional: provider-specific default top_k
    default_top_k: 10

  # Parallel Search API example.
  - name: parallel
    type: parallel
    api_key_env: PARALLEL_API_KEY
    base_url: https://api.parallel.ai/alpha/search
    default_top_k: 10

  # Bing Web Search API (Azure Cognitive Services) example.
  - name: bing
    type: generic_json_http
    api_key_env: BING_API_KEY
    api_key_header: Ocp-Apim-Subscription-Key
    base_url: https://api.bing.microsoft.com/v7.0/search
    method: GET
    query_param: q
    # Bing: {"webPages": {"value": [ { "name": ..., "url": ..., "snippet": ... }, ... ]}}
    result_path: webPages.value
    url_field: url
    title_field: name
    snippet_field: snippet
    score_field: ""
    default_top_k: 10

  # SerpAPI example (Google-like search). SerpAPI uses an "api_key" query param.
  - name: serpapi
    type: generic_json_http
    api_key_env: SERPAPI_API_KEY
    api_key_header: ""
    api_key_query_param: api_key
    base_url: https://serpapi.com/search
    method: GET
    query_param: q
    # SerpAPI: {"organic_results": [ { "title": ..., "link": ..., "snippet": ... }, ... ]}
    result_path: organic_results
    url_field: link
    title_field: title
    snippet_field: snippet
    score_field: ""
    default_top_k: 10

  # Perplexity Search API example.
  - name: perplexity
    type: perplexity
    api_key_env: PERPLEXITY_API_KEY
    base_url: https://api.perplexity.ai/search
    default_top_k: 5

  # Tavily Search API example.
  - name: tavily
    type: tavily
    api_key_env: TAVILY_API_KEY
    base_url: https://api.tavily.com/search
    default_top_k: 5

  # Brave Search API example.
  - name: brave
    type: generic_json_http
    api_key_env: BRAVE_API_KEY
    api_key_header: X-Subscription-Token
    base_url: https://api.search.brave.com/res/v1/web/search
    method: GET
    query_param: q
    # Brave: {"web": { "results": [ { "title": ..., "url": ..., "description": ... }, ... ]}}
    result_path: web.results
    url_field: url
    title_field: title
    snippet_field: description
    score_field: ""
    default_top_k: 10

